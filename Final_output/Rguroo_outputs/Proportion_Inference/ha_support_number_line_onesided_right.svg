<svg width="100%" viewBox="0 0 680 105" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Number line -->
  <line x1="60" y1="55" x2="616" y2="55" stroke="rgb(61, 61, 58)" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Ha support: right tail (p-hat >= 0.727) — orange -->
  <line x1="350.4" y1="55" x2="614" y2="55" stroke="#E69F00" stroke-width="8" stroke-linecap="round"/>

  <!-- p0 = 0.70 tick -->
  <line x1="183.6" y1="41" x2="183.6" y2="69" stroke="rgb(20, 20, 19)" stroke-width="2.5"/>
  <text x="183.6" y="89" text-anchor="middle" style="font-size:15px;fill:rgb(61, 61, 58);font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;">p₀ = 0.70</text>

  <!-- p-hat-obs ≈ 0.727 tick (also the support boundary) -->
  <line x1="350.4" y1="38" x2="350.4" y2="72" stroke="#E69F00" stroke-width="3"/>
  <text x="350.4" y="89" text-anchor="middle" style="font-size:15px;fill:#E69F00;font-family:'Anthropic Sans', -apple-system, 'system-ui', 'Segoe UI', sans-serif;">p̂<tspan style="font-size:0.72em" baseline-shift="sub">obs</tspan> ≈ 0.727</text>
</svg>