project:
  type: book
  output-dir: Final_output
  resources:
    - "Rguroo_html_output/**"
#  post-render:
#    - scripts/make-pdf.sh

number-sections: true

filters:
  - filters/class-to-macro.lua

format:
  html:
    toc: true
    toc-depth: 3
    toc-expand: 3          # ADDED: shows subsections in the right-hand TOC by default
    css: styles.css
    include-after-body: open-links-new-tab.html
  #pdf:
  #  latex-tinytex: false
  #  pdf-engine: xelatex
  #  include-in-header: _preamble.tex
book:
  title: "Introductory Statistics: A Conceptual Approach Using Rguroo"
  author:
    - name: "Alicia Frost"
      affiliation: "Santiago Canyon College"
    - name: "Mortaza Jamshidian"
      affiliation: "California State University, Fullerton"
    - name: "Jessica Kramer"
      affiliation: "Santiago Canyon College"
  date: "2026"
  # REMOVED: cover-image (the cover is now the index.qmd page)
  chapters:
    - index.qmd            # cover page only
    - preface.qmd          # ADDED: your old index.qmd content
    - getting_started_with_rguroo.qmd
    - Statistical Basics.qmd
    - Graphical_Description_of_Data.qmd
    - Numerical-description-of-Data.qmd
    - Probability.qmd
    - Discrete Probability Distribution.qmd
    - Continuous Probability Distribution.qmd
    - Sampling Distributions.qmd
    - foundations_of_inference.qmd
    - proportion inference.qmd
    - mean inference.qmd
    - Regression.qmd
#    - Chi-Square and ANOVA Tests.qmd
    - chi_square_inference.qmd
    - anova.qmd
    - References.qmd